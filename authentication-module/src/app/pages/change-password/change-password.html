<div class="auth-viewport">

  <!-- Background Decorative Circles -->
  <div class="bg-circle circle-top-left"></div>
  <div class="bg-circle circle-bottom-right"></div>


  <!-- Main Card -->
  <div class="auth-card">


    <!-- =====================================================
         LEFT BRAND PANEL
    ====================================================== -->

    <div class="left-panel">

      <!-- Decorative Circles -->
      <div class="pattern-circle circle-top-right"></div>
      <div class="pattern-circle circle-mid-right"></div>
      <div class="pattern-circle circle-bottom-left"></div>


      <!-- Brand Header -->
      <div class="brand-header">

        <div class="security-badge">

          <svg
            class="badge-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect
              x="3"
              y="11"
              width="18"
              height="11"
              rx="2"
              ry="2"
            ></rect>

            <path
              d="M7 11V7a5 5 0 0 1 10 0v4"
            ></path>

          </svg>

          <span>Closetly</span>

        </div>

      </div>


      <!-- Brand Content -->
      <div class="panel-body">

        <p class="small-text">
          ACCOUNT SECURITY
        </p>

        <h2 class="main-statement">
          Keep your account<br>
          <span>protected.</span>
        </h2>

        <p class="description-text">
          Update your password and keep your Closetly account safe and private.
        </p>

      </div>


      <!-- Footer -->
      <div class="panel-footer">
        <span>✦</span>
        Curate. Create. Wear.
      </div>

    </div>



    <!-- =====================================================
         RIGHT FORM PANEL
    ====================================================== -->

    <div class="right-panel">

      <div class="form-wrapper">


        <!-- Form Header -->
        <div class="form-header">

          <button
  type="button"
  class="back-link"
  (click)="router.navigate(['/profile'])"
>
  <span>←</span>
  Back to Profile
</button>

          <h2 class="form-title">
            Change Password
          </h2>

        </div>


        <!-- Error Message -->
        <div
          *ngIf="errorMessage"
          class="alert alert-error"
        >
          {{ errorMessage }}
        </div>


        <!-- Success Message -->
        <div
          *ngIf="successMessage"
          class="alert alert-success"
        >
          {{ successMessage }}
        </div>



        <!-- =================================================
             FORM
        ================================================== -->

        <form
          (ngSubmit)="onChangePassword()"
        >


          <!-- =================================================
               CURRENT PASSWORD
          ================================================== -->

          <div class="form-group">

            <label for="currentPassword">
              Current Password
            </label>

            <div class="input-box">

              <span class="input-icon">
                ◇
              </span>

              <input
                [type]="showCurrentPassword ? 'text' : 'password'"
                id="currentPassword"
                name="currentPassword"
                [(ngModel)]="currentPassword"
                placeholder="Enter your current password"
                required
              />

              <button
                type="button"
                class="eye-btn"
                (click)="toggleVisibility('current')"
              >
                {{ showCurrentPassword ? 'Hide' : 'Show' }}
              </button>

            </div>

          </div>



          <!-- =================================================
               NEW PASSWORD
          ================================================== -->

          <div class="password-group">

            <div class="form-group">

              <label for="newPassword">
                New Password
              </label>

              <div class="input-box">

                <span class="input-icon">
                  ◇
                </span>

                <input
                  [type]="showNewPassword ? 'text' : 'password'"
                  id="newPassword"
                  name="newPassword"
                  [(ngModel)]="newPassword"
                  placeholder="Enter your new password"
                  required
                />

                <button
                  type="button"
                  class="eye-btn"
                  (click)="toggleVisibility('new')"
                >
                  {{ showNewPassword ? 'Hide' : 'Show' }}
                </button>

              </div>

            </div>


            <!-- Password Requirements -->

            <div class="password-requirements">

              <div [class.valid]="hasMinLength">
                <span>•</span>
                8+ characters
              </div>

              <div [class.valid]="hasNumber">
                <span>•</span>
                1 number
              </div>

              <div [class.valid]="hasUppercase">
                <span>•</span>
                1 uppercase
              </div>

              <div [class.valid]="hasSpecialChar">
                <span>•</span>
                1 special symbol
              </div>

            </div>

          </div>



          <!-- =================================================
               CONFIRM PASSWORD
          ================================================== -->

          <div class="form-group">

            <label for="confirmPassword">
              Confirm New Password
            </label>

            <div class="input-box">

              <span class="input-icon">
                ◇
              </span>

              <input
                [type]="showConfirmPassword ? 'text' : 'password'"
                id="confirmPassword"
                name="confirmPassword"
                [(ngModel)]="confirmPassword"
                placeholder="Confirm your new password"
                required
              />

              <button
                type="button"
                class="eye-btn"
                (click)="toggleVisibility('confirm')"
              >
                {{ showConfirmPassword ? 'Hide' : 'Show' }}
              </button>

            </div>

          </div>



          <!-- =================================================
               ACTIONS
          ================================================== -->

          <div class="action-row">

            <button
              type="submit"
              class="btn-submit"
            >

              <span>
                {{ isSubmitting ? 'Saving...' : 'Save Password' }}
              </span>

              <span>
                →
              </span>

            </button>


          </div>


        </form>

      </div>

    </div>

  </div>

</div>
