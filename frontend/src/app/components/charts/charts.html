<div class="charts-section">

    <!-- Clothes by Category -->
    <div class="chart-card">

        <div class="chart-header">
            <div>
                <span class="section-label">WARDROBE INSIGHTS</span>
                <h3>Clothes by Category</h3>
            </div>

            <mat-icon>checkroom</mat-icon>
        </div>

        <div class="bar-chart">

            @for (item of categoryData; track item.name) {

                <div class="bar-row">

                    <div class="bar-label">
                        <span>{{ item.name }}</span>
                        <strong>{{ item.value }}</strong>
                    </div>

                    <div class="bar-track">

                        <div
                            class="bar-fill"
                            [style.width.%]="(item.value / 12) * 100">
                        </div>

                    </div>

                </div>

            }

        </div>

    </div>


    <!-- Clothes by Season -->
    <div class="chart-card">

        <div class="chart-header">
            <div>
                <span class="section-label">SEASONAL STYLE</span>
                <h3>Clothes by Season</h3>
            </div>

            <mat-icon>calendar_month</mat-icon>
        </div>

        <div class="season-list">

            @for (item of seasonData; track item.name) {

                <div class="season-item">

                    <div class="season-info">

                        <span class="season-dot"></span>

                        <span>{{ item.name }}</span>

                    </div>

                    <strong>{{ item.value }}</strong>

                </div>

            }

        </div>

    </div>

</div>
