
<div class="charts-section">
  <div class="chart-card">

    <div class="insights-layout">

      <div class="category-insights">
        @for (item of categoryData; track item.name) {
          <div class="bar-row">

            <div class="category-icon">
              @switch (item.name) {
                @case ('Tops') {
                  <mat-icon>checkroom</mat-icon>
                }
                @case ('Bottoms') {
                  <mat-icon>straighten</mat-icon>
                }
                @case ('Dresses') {
                  <mat-icon>styler</mat-icon>
                }
                
@case ('Shoes') {
  <svg
    class="shoe-icon"
    viewBox="0 0 24 24"
    width="18"
    height="18"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-label="Shoes"
    role="img">
    <path d="M3 15.5c2.5 0 4-1.5 5-4l1-3 3 3c1.5 1.5 3.5 2.5 6 3l3 1v3H3z"/>
    <path d="M9 11.5l2 1"/>
    <path d="M13 13l2 1"/>
    <path d="M3 18.5h18"/>
  </svg>
}

                @case ('Accessories') {
                  <mat-icon>shopping_bag</mat-icon>
                }
                @default {
                  <mat-icon>checkroom</mat-icon>
                }
              }
            </div>

            <div class="bar-content">
              <div class="bar-label">
                <span>{{ item.name }}</span>
                <strong>{{ item.value }}</strong>
              </div>

              <div class="bar-track">
                <div
                  class="bar-fill"
                  [style.width.%]="(item.value / 12) * 100">
                </div>
              </div>
            </div>

          </div>
        }
      </div>

      <div class="insights-image">
        <img
          src="/closetly-insights.jpeg"
          alt="Neutral-toned fashion inspiration">
      </div>

    </div>

  </div>
</div>
