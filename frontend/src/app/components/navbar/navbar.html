
<header class="navbar">

  <!-- Breadcrumb -->
  <div class="left">
    <span class="breadcrumb-muted">My space</span>
    <span class="breadcrumb-separator">/</span>
    <h2>Dashboard</h2>
  </div>

  <div class="right">

    <!-- Search Bar -->
    <div class="search-box">
      <mat-icon>search</mat-icon>

      <input
        type="text"
        placeholder="Search for clothes, outfits, or brands..."
        aria-label="Search for clothes, outfits, or brands"
      />
    </div>

    <!-- Notifications -->
    <div class="notification-wrapper">

      <button
        type="button"
        mat-icon-button
        class="notification-button"
        aria-label="Notifications"
        (click)="toggleNotifications()"
      >
        <mat-icon>notifications_none</mat-icon>

        @if (unreadCount > 0) {
          <span class="notification-badge">
            {{ unreadCount }}
          </span>
        }
      </button>

      @if (showNotifications) {
        <div class="notification-dropdown">
          <app-notification-panel
            (unreadCountChange)="updateUnreadCount($event)">
          </app-notification-panel>
        </div>
      }

    </div>

    <!-- Profile -->
    <div class="profile">
      <div class="avatar">A</div>
      <span class="profile-name">Anushka</span>
      <mat-icon class="profile-chevron">keyboard_arrow_down</mat-icon>
    </div>

  </div>

</header>
