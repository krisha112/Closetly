<header class="navbar">

    <div class="left">

        <h2>Dashboard</h2>

    </div>

    <div class="right">

        <div class="search-box">

            <mat-icon>search</mat-icon>

            <input
                type="text"
                placeholder="Search..."
            >

        </div>


        <!-- Notification -->
        <div class="notification-wrapper">

            <button
                mat-icon-button
                class="notification-button"
                (click)="toggleNotifications()">

                <mat-icon>notifications</mat-icon>

                @if (unreadCount > 0) {

    <span class="notification-badge">
        {{ unreadCount }}
    </span>
    
}

            </button>


           @if (showNotifications) {

    <div class="notification-dropdown">

        <app-notification-panel
            (unreadCountChange)="updateUnreadCount($event)">
        </app-notification-panel>

    </div>

}

        </div>


        <!-- Profile -->
        <div class="profile">

            <div class="avatar">
                A
            </div>

            <span>Anushka</span>

        </div>

    </div>

</header>
