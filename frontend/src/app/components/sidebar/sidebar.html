
<div class="sidebar">

  <!-- BRAND -->
  <div class="logo">
    <img
      src="/closetly-logo.jpg"
      alt="Closetly Logo"
      class="logo-image"
    />

    <h1 class="brand-name">Closetly</h1>
    <p class="brand-tagline">DIGITAL WARDROBE</p>
  </div>

  <!-- FASHION QUOTE -->
  <div class="style-quote">
    <div class="quote-words">
      <span>FASHIONS</span>
      <span>FADE,</span>
      <span>STYLE IS</span>
      <span>ETERNAL</span>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav>

<a routerLink="/dashboard" routerLinkActive="active"
   [routerLinkActiveOptions]="{ exact: true }">
  <mat-icon>dashboard</mat-icon>
  <span>Dashboard</span>
</a>

    <a routerLink="/wardrobe" routerLinkActive="active">
      <mat-icon>checkroom</mat-icon>
      <span>Wardrobe</span>
    </a>

    <a routerLink="/outfit-creator" routerLinkActive="active">
      <mat-icon>auto_awesome</mat-icon>
      <span>Outfit Creator</span>
    </a>

<a routerLink="/my-outfits" routerLinkActive="active">
  <mat-icon>style</mat-icon>
  <span>My Outfits</span>
</a>

<a routerLink="/favourites" routerLinkActive="active">
  <mat-icon>favorite_border</mat-icon>
  <span>Favourites</span>
</a>

    <a routerLink="/profile" routerLinkActive="active">
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </a>
  </nav>

  
<!-- LOGOUT -->
<div class="logout" (click)="logout()" role="button" tabindex="0"
     (keydown.enter)="logout()">
  <mat-icon>logout</mat-icon>
  <span>Logout</span>
</div>

<!-- LOGOUT CONFIRMATION -->
<div
  *ngIf="showLogoutModal"
  class="logout-modal-overlay"
  (click)="cancelLogout()">

  <div
    class="logout-modal"
    role="dialog"
    aria-modal="true"
    (click)="$event.stopPropagation()">

    <h3>Are you sure?</h3>

    <p>Are you sure you want to logout from your Closetly account?</p>

    <div class="logout-modal-actions">
      <button type="button"
              class="logout-cancel-btn"
              (click)="cancelLogout()">
        Cancel
      </button>

      <button type="button"
              class="logout-confirm-btn"
              (click)="confirmLogout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </div>

  </div>
</div>
